PACKAGE_NAME="panel-himax-hx83121a"
PACKAGE_VERSION="1.0.0"

# DKMS 把 /usr/src/${PACKAGE_NAME}-${PACKAGE_VERSION}/ 整个复制到
# ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ 再在那里编译
# （dkms 3.4.3 的 do_build()：CP -a "$source_dir/" "$build_dir"），
# 所以 M= 必须指向 .../build —— 这也是 dkms 自己在没有 MAKE[0] 时用的默认值。
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="panel-himax-hx83121a"
DEST_MODULE_NAME[0]="panel-himax-hx83121a"
# -> /lib/modules/${kernelver}/updates/dkms/panel-himax-hx83121a.ko
# depmod 的搜索顺序是 "updates extramodules built-in"，所以这一份会盖过
# linux-mibook-mainline 装进 kernel/drivers/gpu/drm/panel/ 的那一份。
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
