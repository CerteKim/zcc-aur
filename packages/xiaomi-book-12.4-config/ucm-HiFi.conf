# Xiaomi Book S 12.4 (Qualcomm SC8180X) -- WCD9340 + 2x WSA881x.
#
# This is /Qualcomm/sdm845/HiFi-MM1.conf (used by the Lenovo Yoga C630,
# which has the identical codec/amplifier topology) with the UCM hardware
# mixer element names corrected.
#
# Why: the ctl-remap generated for this card exposes the hardware volumes as
# "Speaker Digital Volume" and "HP Digital Volume", but HiFi-MM1.conf names
# them "Speaker" and "HP".  WirePlumber therefore logs
#
#     spa.alsa: Path Speaker is not a volume or mute control
#     spa.alsa: Path HP is not a volume or mute control
#
# and falls back to *software* volume, leaving the real hardware gain
# wherever it happens to be.
#
# PlaybackMixerElem takes the *simple-mixer* element name: the control name
# with a trailing " Volume" / " Switch" stripped.  Every other profile writes
# it that way ("Headphone", "Digital PCM", "Line Out"), so the names below are
# "Speaker Digital" / "HP Digital" -- NOT the full control name:
#
#     $ amixer -c 0 sget 'Speaker Digital'          # exists
#       Capabilities: volume
#     $ amixer -c 0 sget 'Speaker Digital Volume'   # does not
#     amixer: Unable to find simple control 'Speaker Digital Volume',0
#
# Getting that wrong is what produced the warning, not any alsa-lib/remap
# limitation: the remapped control reads back fine and is listed by
# `amixer -c 0 scontrols`.
#
# The control is a signed dB scale: raw 0 = -84 dB, raw 84 = 0 dB and
# raw 124 = +40 dB.  Do NOT pin it to 124 -- /var/lib/alsa/asound.state
# ships that value, and 40 dB above full scale squares off everything the
# codec receives (audible as clipping, not as extra loudness).  0 dB is the
# correct maximum; use `amixer -c 0 cset numid=2 84` plus `alsactl store`.
#
# IMPORTANT: this file must not be installed on its own.  Once WirePlumber
# can reach the control it will drive it across its whole declared range, so
# 100% on the desktop slider becomes +40 dB.  The matching kernel change, in
# sdm845.c, caps RX1/RX2/RX7/RX8 Digital Volume at 84 (0 dB) for this
# machine; install both together (tools/audio-fix-install.sh does).
#
# Install:
#   sudo tools/audio-fix-install.sh
# or by hand, with the capped snd-soc-sdm845.ko already in place:
#   sudo install -Dm644 ucm2/Qualcomm/xiaomi-book-12.4/HiFi.conf \
#        /usr/share/alsa/ucm2/Qualcomm/xiaomi-book-12.4/HiFi.conf
#   sudo alsactl store

SectionVerb {

	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIMBUS_1_RX Audio Mixer MultiMedia3' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	Include.wcde.File "/codecs/wcd934x/DefaultEnableSeq.conf"
	Include.wsae.File "/codecs/wsa881x/DefaultEnableSeq.conf"

	Include.wcdd {
		File "/codecs/wcd934x/DefaultDisableSeq.conf"
		Before.DisableSequence "0"
	}

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_1_RX Audio Mixer MultiMedia3' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Include.wcdspke.File "/codecs/wcd934x/SpeakerEnableSeq.conf"
	Include.wcdspkd.File "/codecs/wcd934x/SpeakerDisableSeq.conf"
	Include.wsaspke.File "/codecs/wsa881x/SpeakerEnableSeq.conf"
	Include.wsaspkd.File "/codecs/wsa881x/SpeakerDisableSeq.conf"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speaker Digital"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	Include.wcdhpe.File "/codecs/wcd934x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd934x/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Mic"

	Include.wcdmice.File "/codecs/wcd934x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd934x/HeadphoneMicDisableSeq.conf"

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC2"
	}
}
