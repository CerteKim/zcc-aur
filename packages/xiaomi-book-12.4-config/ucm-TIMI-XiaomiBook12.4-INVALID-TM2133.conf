# ALSA UCM profile for the Xiaomi Book S 12.4 (Qualcomm SC8180X).
#
# Card:   driver "sdm845", long name "TIMI-XiaomiBook12.4-INVALID-TM2133"
#         (the long name is DMI-derived: BOARD_VENDOR-PRODUCT- -BOARD, and
#          this machine really does report PRODUCT_VERSION="INVALID")
# Codec:  WCD9340 on SLIMbus + two WSA881x amplifiers on the codec's
#         internal SoundWire master -- the same topology as the Lenovo
#         Yoga C630 (sdm850), so we reuse the distro's own verb.
#
# Installing this file is what makes audio work automatically:
#   - Verb EnableSequence sets the ADSP frontend -> SLIMbus backend routing
#     and the codec/amplifier DAPM muxes.
#   - Speaker/Headphones/Mic devices reference the upstream wcd934x and
#     wsa881x sequences.
#   - codec-init.File gives the "Speaker Digital Volume" / "HP Digital
#     Volume" remap so PipeWire has a master volume control.
#
# In particular the wsa881x DefaultEnableSeq sets the amplifier Port
# switches (DAC/COMP/BOOST/VISENSE).  Without them wsa881x_hw_params()
# registers ZERO SoundWire ports and the amplifiers stay silent while
# still powering up (an audible pop).  The community sc8180x Flex 5G
# profile has that include commented out, which is likely why its audio
# is still listed as broken.
#
# Install:
#   sudo install -Dm644 \
#     ucm2/conf.d/sdm845/TIMI-XiaomiBook12.4-INVALID-TM2133.conf \
#     /usr/share/alsa/ucm2/conf.d/sdm845/
#
# Remove any stale mixer state afterwards, then relog:
#   sudo rm -f /var/lib/alsa/asound.state
#   systemctl restart alsa-restore   # or just reboot

Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/xiaomi-book-12.4/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.codec-init.File "/codecs/wcd934x/init.conf"
