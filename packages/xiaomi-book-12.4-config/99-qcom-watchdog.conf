# Xiaomi Book S 12.4 (sc8180x / TIMI)
#
# The bootloader arms the APSS (KPSS) watchdog before it hands over to the OS.
# While Linux runs in EL1 this is invisible: Qualcomm's hypervisor (QHEE) owns
# EL2 and feeds the watchdog itself.  With Secure-Launch (slbounce) the
# hypervisor is replaced and Linux runs in EL2, so the kernel has to do it.
# CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y only covers the window until userspace
# opens the device, and nothing does by default -- the machine then resets
# itself ~56 s into the boot, silently (no panic, no OOM, no shutdown message,
# nothing in pstore; only the journal simply stops).
#
# Opening /dev/watchdog0 (qcom_wdt on 17c10000.watchdog) from systemd and
# pinging it every RuntimeWatchdogSec/2 keeps the machine alive, and turns a
# future hard lockup into a clean reboot instead of a silent reset.
[Manager]
RuntimeWatchdogSec=30s
