# Bluetooth BD address for the WCN3998 on this board.
#
# The controller has no address provisioned (no OTP / secure-world storage),
# so it comes up with the placeholder from the generic crnv21.bin NVM and
# btqca leaves it unconfigured.  The kernel used to be told the address via
# local-bd-address in the device tree; this file replaces that with a
# userspace workaround (bluetooth-bdaddr.service).
#
# Pick any unicast address you like, but keep the locally-administered bit set
# (the second nibble is 2, 6, a or e) so it cannot collide with a real OUI.
# The default below is an arbitrary locally-administered address.
BDADDR="02:00:00:12:34:56"
