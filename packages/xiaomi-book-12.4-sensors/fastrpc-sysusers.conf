# fastrpc user/group for hexagonrpcd.
#
# hexagonrpcd-sdsp.service runs as User=fastrpc, and the udev rules hand the
# FastRPC device nodes (/dev/fastrpc-*) to that group.  Before this package the
# account was created by hand (useradd -r -g fastrpc -d / -s /usr/bin/nologin),
# which is why the ids on an existing installation may differ - nothing depends
# on the numeric value, only on the name.
g fastrpc -
u fastrpc - "FastRPC daemon" / /usr/bin/nologin
