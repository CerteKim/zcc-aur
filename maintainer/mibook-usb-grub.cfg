# ===================================================================
# Xiaomi Book S 12.4 (sc8180x / TIMI) — USB 启动盘用的 GRUB 配置
#
# 由 maintainer/stage-mibook-usb.sh 读取，替换掉 @INTERNAL_ESP_UUID@ 与
# @INTERNAL_ROOT_UUID@ 后写到暂存树的 /grub/grub.cfg；再由
# maintainer/make-mibook-usb.sh 把 @USB_ROOT_UUID@ 换成 U 盘根分区的 UUID。
#
# ⚠️ menuentry 的**标签必须是纯 ASCII（英文）**，注释可以随便写（注释不显示）。
#
#   本机 GRUB 跑在**文本模式**：ALARM 的 grub 默认 gfxterm=0
#   （/etc/grub.d/00_header 里就是 `gfxterm=0;`，且 /etc/default/grub 没有启用
#   GRUB_TERMINAL_OUTPUT），在用的 /boot/grub/grub.cfg 也保持关闭。
#   文本控制台没有中文字形 —— 中文标签会显示成方块/乱码（这就是当初菜单看不清的
#   原因）。要在菜单里显示中文，必须开 gfxterm 并加载 CJK 字体：
#
#       if loadfont (hd0,gpt1)/grub/fonts/unicode.pf2 ; then
#           insmod efi_gop
#           insmod gfxterm
#           set gfxmode=auto
#           terminal_output gfxterm
#       fi
#
#   但 unicode.pf2 本身不含 CJK（需要另做字体），而这台固件的 GOP 没有验证过 ——
#   菜单一旦看不见就很难引导（这台机器唯一能引导的 GRUB 核来之不易）。所以标签用
#   英文，稳妥优先。
#
#   真想做中文菜单，字体可以这样生成（只要汉字区间，别整包 Noto CJK）：
#       grub-mkfont -s 16 -r 0x3000-0x303f -r 0x4e00-0x9fff -r 0xff00-0xffef \
#           -o <ESP>/grub/fonts/cjk.pf2 \
#           /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
#   然后在上面的 gfxterm 块里 loadfont 这个 cjk.pf2（unicode.pf2 之后加载，
#   作为回退）。
#
# 这个 U 盘上带着**本机唯一能引导的 UEFI loader**：从 linux-surface 的
# Surface Pro X 试验镜像里拷出来的 GRUB 核（245760 字节，
# sha256 204b6d8913d249c331ac13d689644f9342d8df7491fed0a9435b263d10a827ca）。
# Arch Linux ARM 的 grub 包自己构建的那个核在本机起不来（实测），所以
# /EFI/BOOT/BOOTAA64.EFI 是那一份原样的拷贝，不要替换。
#
# 该核内嵌的 prefix 是 (,gpt1)/grub，也就是说：
#   * 这个文件必须在**第一个 GPT 分区（FAT ESP）**的 /grub/grub.cfg；
#   * 模块放在同一个分区的 /grub/arm64-efi/（devicetree 命令来自 fdt.mod）。
#
# 本机固件是 Windows 那套 ACPI 固件，**不提供设备树**，所以每个条目都必须有
# devicetree 行，否则内核根本起不来。
# ===================================================================

set timeout=15
set default=0

# 装好的系统：内部 ESP (nvme0n1p1) 的 FAT UUID 与 btrfs 根的 UUID
set internal_esp=@INTERNAL_ESP_UUID@
set internal_root=@INTERNAL_ROOT_UUID@

# 本机必需的内核参数（与 /etc/grub.d/09_xiaomi_book_dtb 里的一致）
set mibook_args="clk_ignore_unused pd_ignore_unused arm64.nopauth iommu.passthrough=0 iommu.strict=0 efi=noruntime"

# live 根分区（p2）的 UUID，由 make-mibook-usb.sh 格式化后填进来
set usb_root=@USB_ROOT_UUID@

menuentry 'Boot installed system (kernel from internal ESP)' --class arch {
	insmod part_gpt
	insmod fat
	insmod gzio
	search --no-floppy --fs-uuid --set=root $internal_esp
	echo 'Loading /vmlinuz-linux-mibook ...'
	linux /vmlinuz-linux-mibook root=UUID=$internal_root rw $mibook_args loglevel=3 quiet
	echo 'Loading device tree ...'
	devicetree /dtb/linux-mibook/qcom/sc8180x-xiaomi-book-12.4.dtb
	initrd /initramfs-linux-mibook.img
}

menuentry 'Boot installed system (kernel from this USB stick, rescue)' --class arch {
	insmod part_gpt
	insmod fat
	insmod gzio
	# 内核、initramfs、DTB 都从本 U 盘读：内部 ESP 被覆盖/损坏时也能进系统
	set root=(,gpt1)
	echo 'Loading /vmlinuz-linux-mibook from USB ...'
	linux /vmlinuz-linux-mibook root=UUID=$internal_root rw $mibook_args loglevel=3 quiet
	echo 'Loading device tree ...'
	devicetree /dtb/linux-mibook/qcom/sc8180x-xiaomi-book-12.4.dtb
	initrd /initramfs-linux-mibook.img
}

menuentry 'Boot live system from USB' --class arch {
	insmod part_gpt
	insmod fat
	insmod ext2
	insmod gzio
	set root=(,gpt1)
	linux /vmlinuz-linux-mibook root=UUID=$usb_root rw $mibook_args loglevel=3 quiet
	devicetree /dtb/linux-mibook/qcom/sc8180x-xiaomi-book-12.4.dtb
	initrd /initramfs-linux-mibook.img
}

menuentry 'Boot live system from USB (fallback initramfs)' --class arch {
	insmod part_gpt
	insmod fat
	insmod ext2
	insmod gzio
	set root=(,gpt1)
	linux /vmlinuz-linux-mibook root=UUID=$usb_root rw $mibook_args loglevel=3 quiet
	devicetree /dtb/linux-mibook/qcom/sc8180x-xiaomi-book-12.4.dtb
	initrd /initramfs-linux-mibook-fallback.img
}

menuentry 'UEFI Firmware Settings' --class efi {
	fwsetup
}
